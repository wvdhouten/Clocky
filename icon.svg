<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Owl ear tufts -->
  <polygon points="50,74 34,6 104,46" fill="#7a5236"/>
  <polygon points="206,74 222,6 152,46" fill="#7a5236"/>
  <!-- Owl feet -->
  <ellipse cx="94" cy="240" rx="28" ry="13" fill="#ff9f1c"/>
  <ellipse cx="162" cy="240" rx="28" ry="13" fill="#ff9f1c"/>
  <!-- Clock: coral rim, darker inner edge, cream face -->
  <circle cx="128" cy="136" r="112" fill="#ff6b6b"/>
  <circle cx="128" cy="136" r="104" fill="#d94f4f"/>
  <circle cx="128" cy="136" r="101" fill="#fffbea"/>
  <!-- Hour ticks (quarters longer) -->
  <g stroke="#1d2b53" stroke-linecap="round">
    <g stroke-width="11">
      <line x1="128" y1="44" x2="128" y2="66" transform="rotate(0 128 136)"/>
      <line x1="128" y1="44" x2="128" y2="66" transform="rotate(90 128 136)"/>
      <line x1="128" y1="44" x2="128" y2="66" transform="rotate(180 128 136)"/>
      <line x1="128" y1="44" x2="128" y2="66" transform="rotate(270 128 136)"/>
    </g>
    <g stroke-width="7">
      <line x1="128" y1="46" x2="128" y2="58" transform="rotate(30 128 136)"/>
      <line x1="128" y1="46" x2="128" y2="58" transform="rotate(60 128 136)"/>
      <line x1="128" y1="46" x2="128" y2="58" transform="rotate(120 128 136)"/>
      <line x1="128" y1="46" x2="128" y2="58" transform="rotate(150 128 136)"/>
      <line x1="128" y1="46" x2="128" y2="58" transform="rotate(210 128 136)"/>
      <line x1="128" y1="46" x2="128" y2="58" transform="rotate(240 128 136)"/>
      <line x1="128" y1="46" x2="128" y2="58" transform="rotate(300 128 136)"/>
      <line x1="128" y1="46" x2="128" y2="58" transform="rotate(330 128 136)"/>
    </g>
  </g>
  <!-- Hands at 10:10: hour hand 305deg (navy), minute hand 60deg (blue) -->
  <line x1="128" y1="146" x2="128" y2="84" stroke="#1d2b53" stroke-width="16" stroke-linecap="round" transform="rotate(305 128 136)"/>
  <line x1="128" y1="150" x2="128" y2="58" stroke="#1f7fc7" stroke-width="11" stroke-linecap="round" transform="rotate(60 128 136)"/>
  <!-- Centre cap -->
  <circle cx="128" cy="136" r="13" fill="#ffc93c"/>
</svg>
